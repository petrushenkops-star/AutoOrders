name: Import and build AutoOrders
on:
  push:
    paths:
      - 'AutoOrders-0.1.0-source.zip'
      - '.github/workflows/import-and-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract Android source
        run: |
          test -f AutoOrders-0.1.0-source.zip || { echo "Upload AutoOrders-0.1.0-source.zip to the repository root"; exit 1; }
          unzip -q AutoOrders-0.1.0-source.zip -d extracted
          cp -a extracted/AutoOrders/. .
          test -f app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform without obsolete tools
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test and build APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Publish test APK in GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          TAG="v0.1.0-test"
          ASSET="$APK#AutoOrders-0.1.0-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" --title "AutoOrders v0.1.0 — тестовая версия" --notes "Первая тестовая сборка Android. Автоматическое подтверждение реальных финансовых заказов не проверено на сайте. По умолчанию включён тестовый режим." --prerelease
          fi
