name: Build and sign MAX Автосигналы
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Run offline driver and unit tests
        run: |
          node tests/driver-smoke.js
          node tests/ui-layout-smoke.js
          node tests/quick-dialog-shield-smoke.js
          node tests/weekly-search-ui-smoke.js
          node tests/overlay-smoke.js
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Unpack permanent signing key
        env:
          AUTOORDERS_SIGNING_BUNDLE: ${{ secrets.AUTOORDERS_SIGNING_BUNDLE }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AUTOORDERS_SIGNING_BUNDLE" || { echo 'Missing signing secret'; exit 1; }
          mkdir -p "$RUNNER_TEMP/maxcopy-signing"
          printf '%s' "$AUTOORDERS_SIGNING_BUNDLE" | base64 --decode | tar -xz -C "$RUNNER_TEMP/maxcopy-signing"
          echo "MAXCOPY_SIGNING_KEYSTORE=$RUNNER_TEMP/maxcopy-signing/autoorders-release.p12" >> "$GITHUB_ENV"
          password="$(cat "$RUNNER_TEMP/maxcopy-signing/signing-password.txt")"
          echo "::add-mask::$password"
          echo "MAXCOPY_SIGNING_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "MAXCOPY_SIGNING_ALIAS=$(cat "$RUNNER_TEMP/maxcopy-signing/key-alias.txt")" >> "$GITHUB_ENV"
      - name: Build signed APK and verify certificate
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | grep -Fi 'edf5ba9d6632e94fbb80271d447775e31bc17b0f5c5958923bab1bb9bf01ba69'
          cp "$APK" MaxSignalCopy-0.4.7-signed.apk
      - name: Publish signed release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=max-copy-v0.4.7
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" MaxSignalCopy-0.4.7-signed.apk --target "$GITHUB_SHA" \
              --title 'MAX Автосигналы 0.4.7 (подписано)' --prerelease \
              --notes 'Во время исполнения скрыта всплывающая форма «Быстрый» сайта с помощью нативной панели прогресса. DOM-действия не изменены; на ошибке есть кнопка ручного просмотра сайта. На реальном сайте не проверено.'
          fi
